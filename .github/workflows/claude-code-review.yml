name: Claude Code Review

# Runs on every push to a branch that has an open pull request
# (opened = first push, synchronize = every following push).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the review still running for the previous one
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # The review needs one of the two repository secrets:
      # - ANTHROPIC_API_KEY: an API key from console.anthropic.com
      # - CLAUDE_CODE_OAUTH_TOKEN: a Claude Pro/Max subscription token (`claude setup-token`)
      # Secrets are empty on pull requests from forks: then the review is skipped, not failed.
      - name: Check Claude credentials
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Claude review skipped::Add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret in Settings > Secrets and variables > Actions"
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        if: steps.credentials.outputs.available == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request of a Spring Boot microservice that normalizes
            ODDS_CHANGE and BET_SETTLEMENT messages from two feed providers into one
            standard format. Focus on:
            - correctness bugs (wrong mapping, null handling, wrong HTTP status codes)
            - validation of the incoming provider messages
            - missing or weak tests for the changed code
            - Spring Boot / Java best practices, only where they matter

            Use `gh pr diff` and `gh pr view` to read the change.
            Post specific issues as inline comments with
            mcp__github_inline_comment__create_inline_comment, then post one short
            summary comment with `gh pr comment`. Do not comment on style nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
